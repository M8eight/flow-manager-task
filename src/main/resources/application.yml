spring:
  application:
    name: flow-manager

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    schemas:
      - public
    callback-locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432}/${DB_DB:flow_manager_db}
    username: ${DB_USER:flow_manager_user}
    password: ${DB_PASS:flow_manager_pass}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      file-size-threshold: 2MB

  cloud:
    openfeign:
      client:
        config:
          subscription-service:
            error-decoder: com.task.flow_manager.infrastructure.client.SubscriptionErrorDecoder
            connect-timeout: 2000
            read-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
  cache:
    type: redis
    redis:
      time-to-live: 10m

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      group-id: pdf-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 2
      properties:
        spring.json.trusted.packages: "com.task.flow_manager.application.dto"
        spring.json.value.default.type: com.task.flow_manager.application.dto.event.FileConversionCompletedEvent
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        max.poll.interval.ms: 600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    listener:
      ack-mode: record
      concurrency: 3

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

server:
  port: 8082

app:
  upload:
    limits:
      free: 100MB
      paid: 2GB
  watchdog:
    interval: PT1M
    timeout: PT15M
  s3:
    endpoint: ${S3_URL:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:user}
    secret-key: ${S3_SECRET_KEY:password}
    bucket-name: file-converter-storage
    call-timeout: 15
    call-attempt-timeout: 5
    folders:
      incoming: "uploads/"
  outbox:
    lease-seconds: 60
    max-attempts: 5
  kafka:
    topics:
      input: converter.requested
      output: converter.completed
      subscription-input: subscription.changed
  cleanup:
    delete-batch-limit: 5000

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: INFO